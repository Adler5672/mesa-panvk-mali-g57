name: Build SPIRV-Tools ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout SPIRV-Tools
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Tools
          ref: main
          submodules: recursive
          path: SPIRV-Tools

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build   g++
      - name: Checkout SPIRV-Headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: main
          path: SPIRV-Tools/external/spirv-headers
      - name: Configure
        run: |
          cmake -S SPIRV-Tools -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON \
            -DSPIRV_WERROR=OFF \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Inspect build outputs
        run: |
          find build -type f \( \
          -name '*.so' -o \
          -name '*.so.*' -o \
          -name '*.a' \
          \) -print

      - name: Package
        run: |
         mkdir -p artifact/lib

         cp -av build/source/libSPIRV-Tools-shared.so artifact/lib/

         ls -lah artifact/lib

         tar -czf spirv-tools-arm64.tar.gz -C artifact .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spirv-tools-arm64
          path: spirv-tools-arm64.tar.gz
