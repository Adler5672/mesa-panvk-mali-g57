name: build-panvk-g57
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04        # change to match your proot Ubuntu
    steps:
      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git build-essential pkg-config python3 python3-pip \
            python3-packaging python3-setuptools python3-mako python3-yaml python3-ply \
            bison flex glslang-tools spirv-tools libexpat1-dev zlib1g-dev libzstd-dev \
            libdrm-dev libvulkan-dev libx11-dev libxext-dev libxcb1-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-shm0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxshmfence-dev libxrandr-dev \
            libwayland-dev wayland-protocols libclang-dev libllvmspirvlib-dev \
            libclc-dev llvm-dev meson ninja-build
      - name: Clone source
        run: git clone --depth 1 https://github.com/apexspan-svg/mesa-panvk-mali-g57.git src
      - name: Configure
        working-directory: src
        run: |
          meson setup build -Dbuildtype=release -Dprefix=/opt/panvk \
            -Dpanvk-use-kbase=true -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dplatforms=x11 -Dpanfrost-kmds=kbase,panthor -Dbuild-tests=false
      - name: Build
        working-directory: src
        run: ninja -C build
      - name: Install to staging dir
        working-directory: src
        run: DESTDIR=$PWD/out ninja -C build install
      - name: Package
        run: tar -czf panvk-g57-glibc.tar.gz -C src/out .
      - uses: actions/upload-artifact@v4
        with:
          name: panvk-g57-glibc
          path: panvk-g57-glibc.tar.gz
