name: build-panvk-g57
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    steps:
      - name: Install build deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y build-essential git ca-certificates ninja-build python3-packaging
          apt-get build-dep -y mesa

      - name: Clone source
        run: git clone --depth 1 https://github.com/apexspan-svg/mesa-panvk-mali-g57.git src

      - name: Build
        working-directory: src
        run: |
          meson setup build \
            -Dbuildtype=release -Dprefix=/opt/panvk \
            -Dpanvk-use-kbase=true -Dvulkan-drivers=panfrost -Dgallium-drivers= \
            -Dplatforms=x11 -Dpanfrost-kmds=kbase,panthor -Dbuild-tests=false
          ninja -C build
          DESTDIR=$PWD/out ninja -C build install

      - name: Package
        run: tar -czf panvk-g57-glibc.tar.gz -C src/out .

      - uses: actions/upload-artifact@v4
        with:
          name: panvk-g57-glibc
          path: panvk-g57-glibc.tar.gz
